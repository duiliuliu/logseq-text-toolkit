name: CI

on:
  push:
    branches:
      - main
      - master
      - dev-text-tool
  pull_request:
    branches:
      - main
      - master
      - dev-text-tool
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check
